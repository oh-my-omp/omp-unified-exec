name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bun-pty:
    name: Test Bun (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies from npm lockfile
        run: npm ci

      - name: Typecheck
        run: bun run check

      - name: Test Bun PTY from source
        run: bun tests/bun-pty-runtime.mjs

      - name: Test Bun PTY from compiled executable (POSIX)
        if: runner.os != 'Windows'
        run: |
          mkdir -p .build
          bun build --compile tests/bun-pty-runtime.mjs --outfile .build/bun-pty-runtime
          ./.build/bun-pty-runtime

      - name: Test Bun PTY from compiled executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .build | Out-Null
          bun build --compile tests/bun-pty-runtime.mjs --outfile .build/bun-pty-runtime.exe
          & ./.build/bun-pty-runtime.exe

      - name: Test
        run: bun test
        timeout-minutes: 10
