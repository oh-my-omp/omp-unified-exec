name: CI
on:
  pull_request:
    branches: [main]
jobs:
  attach:
    name: Attach (${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Get procdump
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile pd.zip
          Expand-Archive pd.zip -DestinationPath "$env:RUNNER_TEMP\pd"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\dumps" | Out-Null
      - name: Crashing files in one attached process, with npm test as background load
        shell: pwsh
        env:
          EXPECT_PTY: "1"
        run: |
          $load = Start-Process -FilePath "cmd.exe" -ArgumentList "/c","for /L %i in (1,1,20) do npm test > NUL 2>&1" -PassThru -WindowStyle Hidden
          for ($i = 1; $i -le 7; $i++) {
            $out = & "$env:RUNNER_TEMP\pd\procdump64.exe" -accepteula -ma -e -x "$env:RUNNER_TEMP\dumps" node.exe "--import" "tsx" "--test" "--experimental-test-isolation=none" "--test-reporter=tap" "tests\tern-terminal-hud.test.ts" "tests\wake-e2e.test.ts" 2>&1
            $dumps = @(Get-ChildItem "$env:RUNNER_TEMP\dumps" -Filter *.dmp -ErrorAction SilentlyContinue).Count
            $summary = ($out | Select-String -Pattern "^# (tests|pass|fail) " | ForEach-Object { $_.Line }) -join " "
            "DIAGITER $i dumps=$dumps $summary"
            $out | Select-String -Pattern "Exception|Dump [0-9]|C0000005|terminated" | Select-Object -Last 6 | ForEach-Object { "  $_" }
            if ($dumps -gt 0) { break }
          }
          Stop-Process -Id $load.Id -Force -ErrorAction SilentlyContinue
      - name: Analyze dumps
        if: always()
        shell: pwsh
        run: |
          $dumps = Get-ChildItem "$env:RUNNER_TEMP\dumps" -Filter *.dmp -ErrorAction SilentlyContinue
          "DIAGDUMPS $($dumps.Count) $($dumps.Name -join ',')"
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          foreach ($d in ($dumps | Select-Object -First 2)) {
            "===== DIAGDUMP $($d.Name)"
            & $cdb -z $d.FullName -c ".symfix; .reload; .lastevent; .ecxr; r; kn 60; lmv m conpty*; lmv m pty*; ~* kn 15; q" 2>&1 | ForEach-Object { "DIAGCDB $_" } | Select-Object -First 700
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attach-${{ matrix.shard }}
          path: ${{ runner.temp }}/dumps
          if-no-files-found: ignore
