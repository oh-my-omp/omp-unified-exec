name: CI
on:
  pull_request:
    branches: [main]
jobs:
  diag:
    name: Diag (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsx --test --test-reporter=spec tests/zz-diag.test.ts
        env:
          EXPECT_PTY: "1"
