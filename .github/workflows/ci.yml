name: CI
on:
  pull_request:
    branches: [main]
jobs:
  stress:
    name: Stress (${{ matrix.mode }} / ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [mixed, exit, kill]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Get procdump
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile pd.zip
          Expand-Archive pd.zip -DestinationPath "$env:RUNNER_TEMP\pd"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\dumps" | Out-Null
      - name: Stress under procdump
        shell: pwsh
        env:
          STRESS_MODE: ${{ matrix.mode }}
          STRESS_N: "300"
          STRESS_C: "4"
        run: |
          $tsx = (Resolve-Path node_modules\tsx\dist\cli.mjs).Path
          for ($i = 1; $i -le 6; $i++) {
            $out = & "$env:RUNNER_TEMP\pd\procdump64.exe" -accepteula -ma -e -x "$env:RUNNER_TEMP\dumps" node.exe "--import" "tsx" "tests\zz-stress.ts" 2>&1
            "DIAGITER $i exit $LASTEXITCODE"
            $out | Select-String -Pattern "STRESS done|Exception|Dump|exited|terminated|C0000005|0xc0000005" | Select-Object -Last 12 | ForEach-Object { "  $_" }
          }
      - name: Analyze dumps
        if: always()
        shell: pwsh
        run: |
          $dumps = Get-ChildItem "$env:RUNNER_TEMP\dumps" -Filter *.dmp -ErrorAction SilentlyContinue
          "DIAGDUMPS $($dumps.Count) $($dumps.Name -join ',')"
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          foreach ($d in ($dumps | Select-Object -First 2)) {
            "===== DIAGDUMP $($d.Name)"
            & $cdb -z $d.FullName -c ".symfix; .reload; .lastevent; .ecxr; r; kn 60; lmv m conpty*; ~* kn 12; q" 2>&1 | ForEach-Object { "DIAGCDB $_" } | Select-Object -First 500
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-${{ matrix.mode }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/dumps
          if-no-files-found: ignore
